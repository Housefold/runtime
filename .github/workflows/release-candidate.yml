name: Prepare offline Runtime candidate
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full reviewed Runtime source commit (40 hex characters)
        required: true
      version:
        description: v1 candidate version (for example 1.0.0-candidate.abcdef123456)
        required: true
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.8
      - name: Start pinned OCI-capable builder
        run: |
          docker buildx create --name housefold-candidate --driver docker-container --driver-opt image=moby/buildkit:v0.24.0@sha256:6eceb8971ce4fceb3daca562832642706238b7eea72941fcf9896c93c3c4a53e --use
          docker buildx inspect housefold-candidate --bootstrap
      - name: Verify source and prepare both exact architectures
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch('[a-f0-9]{40}',os.environ['CANDIDATE_SOURCE']):raise SystemExit('full source commit required')
          PY
          git worktree add --detach "$RUNNER_TEMP/reviewed-source" "$CANDIDATE_SOURCE"
          (cd "$RUNNER_TEMP/reviewed-source" && bash scripts/agent_verify.sh)
          python3 scripts/release_candidate.py prepare --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --out "$RUNNER_TEMP/candidate" --images
          python3 scripts/release_candidate.py verify --out "$RUNNER_TEMP/candidate"
          echo "Prepared offline candidate; not a validated or published release."
      # Registry credentials/custody and immutable staging branch
      # must be provisioned before build archives can become distribution. No push,
      # Pages deployment or release action is authorized by a successful build.
      - name: Retain offline engineering build archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-candidate-${{ inputs.source }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30
      - name: Remove disposable candidate builder
        if: always()
        run: docker buildx rm housefold-candidate
